# --- Core project info ---
sonar.projectKey=AjinkyaSawale_Blood-Pressure-Calculator
sonar.organization=ajinkyasawale
sonar.projectName=Blood-Pressure-Calculator
sonar.projectVersion=1.0

# --- Where is the code vs tests? ---
sonar.sources=.
# treat app/ui/telemetry as main sources, ignore test/perf folders
sonar.exclusions=tests/**, e2e/**, perf/**, bdd/**, coverage/**, **/*.test.js

sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js, tests/**/*.spec.js

# --- Coverage from Vitest (lcov) ---
sonar.javascript.lcov.reportPaths=coverage/lcov.info
