sonar.projectKey=AjinkyaSawale_Blood-Pressure-Calculator
sonar.organization=ajinkyasawale
sonar.projectName=Blood Pressure Calculator
sonar.sourceEncoding=UTF-8

# App + UI + telemetry source code
sonar.sources=.
sonar.exclusions=coverage/**,node_modules/**,tests/**,bdd/**,e2e/**,perf/**,.github/**

# Test locations
sonar.tests=tests,bdd,e2e,perf
sonar.test.inclusions=tests/**/*.js,bdd/**/*.js,e2e/**/*.mjs,perf/**/*.js

# Tell Sonar where to find JS coverage (we’ll generate this next)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
