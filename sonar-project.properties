# --- Project identity (keep these as they are for your project) ---
sonar.projectKey=AjinkyaSawale_Blood-Pressure-Calculator
sonar.organization=ajinkyasawale
sonar.projectName=Blood-Pressure-Calculator
sonar.sourceEncoding=UTF-8

# --- What is considered "production code"? ---
# Only the REAL app logic files should count for coverage.
sonar.sources=app.js,ui.js,telemetry.js

# --- Where are the tests? (used for issues + coverage attribution) ---
sonar.tests=tests,bdd,e2e,perf

# Explicitly say which files are tests so they are NOT counted as code to cover
sonar.test.inclusions=\
  tests/**/*.js,\
  bdd/**/*.js,\
  e2e/**/*.mjs,\
  perf/**/*.js

# --- Coverage: use Vitest LCOV output ---
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# --- Do NOT expect coverage on these (helpers / config / infra etc.) ---
sonar.coverage.exclusions=\
  **/tests/**,\
  **/bdd/**,\
  **/e2e/**,\
  **/perf/**,\
  **/node_modules/**,\
  **/coverage/**,\
  **/dist/**,\
  **/vitest.config.*,\
  **/playwright.config.*,\
  **/.github/**,\
  **/*.config.js,\
  **/*.config.mjs
