<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blood Pressure Category Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="card">
    <h1>Blood Pressure Category Calculator</h1>

    <form id="bp-form">
      <div class="field">
        <label for="sys">Systolic (70–190 mmHg)</label>
        <input
          id="sys"
          name="sys"
          type="number"
          min="70"
          max="190"
          required
          aria-label="Systolic input"
        />
      </div>

      <div class="field">
        <label for="dia">Diastolic (40–100 mmHg)</label>
        <input
          id="dia"
          name="dia"
          type="number"
          min="40"
          max="100"
          required
          aria-label="Diastolic input"
        />
      </div>

      <button type="submit">Calculate</button>
    </form>

    <section id="result" aria-live="polite"></section>

    <p class="hint">
      * Lower limits are inclusive. For example, systolic ≥ 140 or diastolic ≥ 90
      means <strong>High blood pressure</strong>.
    </p>
  </main>

  <!-- Load ONLY the UI layer -->
  <script type="module" src="./ui.js"></script>
</body>
</html>
