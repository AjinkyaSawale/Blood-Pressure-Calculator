<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Blood Pressure Category Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="card">
      <h1>Blood Pressure Category Calculator</h1>

      <form id="bp-form">
        <div class="field">
          <label for="sys">Systolic (70–190 mmHg)</label>
          <input
            id="sys"
            name="sys"
            type="number"
            min="70"
            max="190"
            required
          />
          <small
            id="sys-error"
            class="error"
            aria-live="polite"
          ></small>
        </div>

        <div class="field">
          <label for="dia">Diastolic (40–100 mmHg)</label>
          <input
            id="dia"
            name="dia"
            type="number"
            min="40"
            max="100"
            required
          />
          <small
            id="dia-error"
            class="error"
            aria-live="polite"
          ></small>
        </div>

        <button type="submit" disabled>Calculate</button>
      </form>

      <section id="result" aria-live="polite"></section>

      <p class="hint">
        * Lower limits are inclusive. For example, systolic ≥ 140 or diastolic ≥ 90
        means <strong>High blood pressure</strong>.
      </p>
    </main>

    <!-- Azure Application Insights (browser SDK) -->
    <!-- Replace the connectionString with your real one from the Azure portal -->
    <script
      src="https://js.monitor.azure.com/scripts/b/ai.3.gbl.min.js"
      crossorigin="anonymous"
    ></script>
    <script>
      // Only configure if the SDK loaded correctly
      if (window.ApplicationInsights) {
        const ai = new ApplicationInsights({
          config: {
            connectionString:
              "InstrumentationKey=ff4bb0a6-a5ab-4abb-9ea1-a49b3b1f191f;IngestionEndpoint=https://eastus-8.in.applicationinsights.azure.com/;LiveEndpoint=https://eastus.livediagnostics.monitor.azure.com/;ApplicationId=db052ca9-9929-464c-b45a-e3dbb7beb53d;IngestionEndpoint=https://YOUR-REGION-0.in.applicationinsights.azure.com/",
          },
        });

        ai.loadAppInsights();
        window.appInsights = ai; // make it visible to ui.js
        ai.trackPageView({ name: "BP Calculator Page" });
      }
    </script>

    <!-- Load ONLY the UI layer -->
    <script type="module" src="./ui.js"></script>
  </body>
</html>
