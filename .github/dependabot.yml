version: 2

updates:
  # 1 — Check your npm dependencies weekly
  - package-ecosystem: "npm"
    directory: "/"          # Location of package.json
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"

  # 2 — Check GitHub Actions versions weekly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
      - "automation"
