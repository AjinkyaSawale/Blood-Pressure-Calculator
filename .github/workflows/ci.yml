name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Vitest)
        run: npm run test:ci

      - name: Run BDD tests (Cucumber)
        run: npm run test:bdd

      - name: Run security audit (npm audit)
        run: npm audit --audit-level=high

      # ---------------------------
      # OWASP Dependency Check
      # ---------------------------
      - name: OWASP Dependency Check - Download
        run: |
          wget https://github.com/jeremylong/DependencyCheck/releases/download/v12.1.0/dependency-check-12.1.0-release.zip
          unzip dependency-check-12.1.0-release.zip

      - name: OWASP Dependency Check - Run Scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}   # <-- GitHub Secret
        run: |
          ./dependency-check/bin/dependency-check.sh \
            --project "Blood Pressure Calculator" \
            --scan . \
            --format "JSON" \
            --out dependency-check-report \
            --nvdApiKey "$NVD_API_KEY" \
            --failOnCVSS 7

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report

      # ---------------------------
      # Playwright Setup & E2E tests
      # ---------------------------
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests (Category + MAP + Low BP)
        run: npm run test:e2e

      # ---------------------------
      # Performance testing with k6 (baseline)
      # ---------------------------
      - name: Setup k6
        uses: grafana/setup-k6-action@v0.3.1

      - name: Run k6 baseline performance test
        run: |
          npx http-server -p 5500 -c-1 . &
          SERVER_PID=$!

          # Give server time to start
          sleep 5

          # Run k6 baseline test (10s, thresholds enforced)
          k6 run perf/bp-baseline.js

          # Try to stop the server; don't fail if it's already dead
          kill $SERVER_PID || true

      # ---------------------------
      # SonarCloud Scan
      # ---------------------------
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
