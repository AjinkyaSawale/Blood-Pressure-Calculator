name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # -----------------------
  # 1. Core CI (tests + scans)
  # -----------------------
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Run BDD tests (Cucumber)
        run: npm run test:bdd

      - name: Run security audit (npm audit)
        run: npm run audit

      # E2E is heavier, so only run it once on Node 20
      - name: Install Playwright browsers (for E2E)
        if: matrix.node-version == '20'
        run: npx playwright install --with-deps

      - name: Run E2E tests (Category + MAP)
        if: matrix.node-version == '20'
        run: |
          npx http-server -p 5500 -c-1 . &
          sleep 5
          npm run test:e2e

  # -----------------------
  # 2. Deploy to QA (simulated)
  # -----------------------
  deploy_qa:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    environment:
      name: qa
      url: https://example.com/qa   # simulated QA URL

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate deploy to QA
        run: |
          echo "Simulating deploy to QA environment..."
          mkdir -p deployments/qa
          cp -r index.html styles.css app.js ui.js deployments/qa/ || true
          echo "QA deploy simulation complete"

  # -----------------------
  # 3. Deploy to Staging (simulated)
  # -----------------------
  deploy_staging:
    needs: deploy_qa
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    environment:
      name: staging
      url: https://example.com/staging   # simulated staging URL

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate deploy to Staging (canary style)
        run: |
          echo "🚦 Simulating canary-style deploy to STAGING..."
          mkdir -p deployments/staging
          cp -r index.html styles.css app.js ui.js deployments/staging/ || true
          echo " Canary check notes:"
          echo "- Compare staging vs QA behaviour"
          echo "- Check telemetry events + k6 baseline before promoting to prod"
          echo "Staging deploy simulation complete"

  # -----------------------
  # 4. Deploy to Production (simulated)
  # -----------------------
  deploy_production:
    needs: deploy_staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://example.com   # purely illustrative

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate deploy to Production (blue/green style)
        run: |
          echo " Deploying new BLUE version of app to production folder..."
          mkdir -p deployments/production-blue
          cp -r index.html styles.css app.js ui.js deployments/production-blue/ || true

          echo " BLUE version ready. In a real setup, traffic would be slowly shifted"
          echo "   from GREEN -> BLUE (canary), watching telemetry + k6 dashboards."
          echo "   If stable, BLUE becomes new GREEN."
