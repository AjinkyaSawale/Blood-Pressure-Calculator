name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ---------------- CI: build + tests + artifact ----------------
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # Vitest: unit + UI + telemetry + lint tests (e2e & k6 excluded)
      - name: Run unit / UI / telemetry tests
        run: npm test

      - name: Run BDD tests (Cucumber)
        run: npm run test:bdd

      - name: Run security audit
        run: npm run audit

      # Playwright E2E (Category + MAP + Low BP)
      - name: Install Playwright browsers (for E2E)
        run: npx playwright install --with-deps

      - name: Run E2E tests (Playwright)
        run: |
          npx http-server -p 5500 -c-1 . > /dev/null 2>&1 &
          SERVER_PID=$!
          sleep 5
          npm run test:e2e
          kill $SERVER_PID || true

      # Lightweight k6 perf smoke
      - name: Run k6 performance smoke test
        run: npm run test:k6

      # Package site as deployment artifact
      - name: Package app artifact
        run: |
          mkdir -p dist
          cp index.html styles.css app.js ui.js telemetry.js dist/
          tar -czf bp-app.tar.gz dist

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: bp-app
          path: bp-app.tar.gz

  # ---------------- CD: QA ----------------
  deploy_qa:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: https://example.com/qa

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: bp-app

      - name: Deploy to QA (simulated)
        run: |
          echo "Deploying bp-app.tar.gz to QA environment..."
          ls -lh bp-app.tar.gz

  # ---------------- CD: Staging ----------------
  deploy_staging:
    needs: deploy_qa
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://example.com/staging

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: bp-app

      - name: Deploy to Staging (simulated)
        run: |
          echo "Deploying bp-app.tar.gz to Staging environment..."
          ls -lh bp-app.tar.gz

  # ---------------- CD: Canary (real artifact + outcome) ----------------
  canary_release:
    needs: deploy_staging
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.canary_outcome.outputs.status }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: bp-app

      - name: Start canary (simulated 10% traffic)
        run: |
          echo "Starting canary release with bp-app.tar.gz (10% traffic)..."
          ls -lh bp-app.tar.gz

      - name: Run canary smoke checks
        id: canary_outcome
        run: |
          echo "Running canary smoke tests against canary environment..."
          # In a real setup you’d curl health endpoints here.
          # For CA we keep it green and explicit:
          echo "status=success" >> "$GITHUB_OUTPUT"

  # ---------------- CD: Automatic rollback if canary fails ----------------
  rollback_production:
    needs: canary_release
    if: needs.canary_release.outputs.status != 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Roll back production (simulated)
        run: |
          echo "Canary FAILED – rolling back production to previous stable version..."
          echo "Rollback complete (simulated)."

  # ---------------- CD: Production deploy if canary OK ----------------
  deploy_production:
    needs: canary_release
    if: needs.canary_release.outputs.status == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://example.com

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: bp-app

      - name: Deploy to Production (simulated)
        run: |
          echo "Canary succeeded – deploying bp-app.tar.gz to PRODUCTION..."
          ls -lh bp-app.tar.gz
          echo "Production deployment complete (simulated)."
