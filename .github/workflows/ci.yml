name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ---------------- CI: tests, security, coverage ----------------
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit + UI + telemetry + lint-rule tests (Vitest)
        run: npm test

      - name: Run BDD tests (Cucumber)
        run: npm run test:bdd

      - name: Run security audit (npm audit)
        run: npm run audit

      # Keep your original Playwright E2E run as part of CI
      - name: Run E2E tests (Playwright)
        run: |
          npx http-server -p 5500 -c-1 . > e2e-http.log 2>&1 &
          echo $! > http-server.pid
          sleep 5
          npm run test:e2e
        env:
          CI: true

      - name: Stop http-server
        if: always()
        run: |
          if [ -f http-server.pid ]; then
            kill "$(cat http-server.pid)" || true
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Upload E2E http-server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-http-log
          path: e2e-http.log

  # ---------------- QA deployment (simulated) ----------------
  deploy_qa:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: qa
      url: https://example.com/qa
    steps:
      - name: Deploy to QA (simulated)
        run: echo "Deploying build to QA environment..."

  # ---------------- Staging deployment (simulated) ----------------
  deploy_staging:
    needs: deploy_qa
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://example.com/staging
    steps:
      - name: Deploy to Staging (simulated)
        run: echo "Deploying build to STAGING environment..."

  # ---------------- Real canary + artifacts ----------------
  canary_release:
    needs: deploy_staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: canary
      url: https://example.com/canary
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start canary http-server
        run: |
          npx http-server -p 5500 -c-1 . > canary-http.log 2>&1 &
          echo $! > canary-http.pid
          sleep 5

      # This is your "real" canary: run a small E2E smoke suite
      - name: Run canary smoke E2E tests
        run: npm run test:e2e
        env:
          CANARY_PERCENT: "10"

      - name: Stop canary http-server
        if: always()
        run: |
          if [ -f canary-http.pid ]; then
            kill "$(cat canary-http.pid)" || true
          fi

      - name: Upload canary logs & results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-artifacts
          path: |
            canary-http.log
            coverage
        # (you can add perf / k6 or extra reports here later)

  # ---------------- Automatic rollback on failed canary ----------------
  rollback_production:
    needs: canary_release
    runs-on: ubuntu-latest
    if: needs.canary_release.result == 'failure'
    steps:
      - name: Rollback production to previous stable (simulated)
        run: |
          echo "Canary FAILED – rolling back production to previous stable build."
          echo "In a real pipeline this step would redeploy the last known-good artifact."

  # ---------------- Full production deployment on successful canary ----------------
  deploy_production:
    needs:
      - canary_release
      - rollback_production
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' &&
      needs.canary_release.result == 'success'
    environment:
      name: production
      url: https://example.com
    steps:
      - name: Deploy to PRODUCTION (simulated)
        run: |
          echo "Canary succeeded – rolling out to 100% of traffic (simulated full production deploy)."
