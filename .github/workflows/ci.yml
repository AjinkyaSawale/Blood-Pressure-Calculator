name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:

jobs:
  ci:
    name: Run CI (tests + lint + security)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint || true

      - name: Security scan (npm audit)
        run: npm audit --audit-level=moderate || true

      - name: Run tests
        run: npm test

  deploy_qa:
    name: Deploy to QA (simulated)
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: QA deploy step
        run: |
          echo "Deploying to QA..."
          echo "Environment URL: https://example.com/qa"

    environment:
      name: qa
      url: https://example.com/qa

  deploy_staging:
    name: Deploy to Staging (simulated)
    runs-on: ubuntu-latest
    needs: deploy_qa
    steps:
      - name: Staging deploy step
        run: |
          echo " Deploying to Staging..."
          echo "Environment URL: https://example.com/staging"

    environment:
      name: staging
      url: https://example.com/staging

  canary_deploy:
    name: Canary Deployment Simulation (10% → 50% → 100%)
    runs-on: ubuntu-latest
    needs: deploy_staging
    steps:

      - name: Start Canary Phase (10% traffic)
        run: |
          echo " Starting canary rollout → 10% traffic"
          sleep 2
          echo "Health check: OK"

      - name: Increase Canary to 50%
        run: |
          echo " Increasing canary to 50%..."
          sleep 2
          echo "Health check: OK"

      - name: Full Rollout (100%)
        run: |
          echo "Canary successful. Rolling out 100% to production."
          sleep 2

    environment:
      name: production
      url: https://example.com

  deploy_production:
    name: Final Production Deployment (simulated)
    runs-on: ubuntu-latest
    needs: canary_deploy
    steps:
      - name: Deploy to Production
        run: |
          echo " Full production deployment completed."
          echo "URL: https://example.com"

    environment:
      name: production
      url: https://example.com
