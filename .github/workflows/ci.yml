name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---------- STATIC ANALYSIS & UNIT / BDD / SECURITY ----------

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests (Vitest + coverage)
        run: npm test

      - name: Run BDD tests (Cucumber)
        run: npm run test:bdd

      - name: Run security tests (custom security suite)
        run: npm run test:security

      - name: Run dependency audit (high severity+)
        run: npm run audit

      # ---------- BROWSER SETUP & E2E + PERF (k6) ----------

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start HTTP server (for E2E + k6)
        run: |
          npx http-server -p 5500 -c-1 . &
          echo $! > http-server.pid
          sleep 5

      - name: Run E2E tests (Playwright, real browser)
        run: npm run test:e2e

      - name: Setup k6
        uses: grafana/setup-k6-action@v0.2.0
        with:
          version: v0.55.0

      - name: Run k6 baseline load test
        run: k6 run perf/bp-baseline.js

      - name: Stop HTTP server
        if: always()
        run: |
          if [ -f http-server.pid ]; then
            kill "$(cat http-server.pid)" || true
          fi

      # ---------- SONARCLOUD CODE QUALITY GATE ----------

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=AjinkyaSawale_Blood-Pressure-Calculator
            -Dsonar.organization=ajinkyasawale
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.sources=.
            -Dsonar.exclusions=coverage/**,perf/**,bdd/**,tests/**

  cd:
    name: CD – QA → Staging → Canary → Prod (simulated)
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- BUILD QA ARTIFACT ----------

      - name: Build QA drop (simulated)
        run: |
          mkdir -p dist-qa
          cp index.html styles.css app.js ui.js telemetry.js dist-qa/ || true

      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-drop
          path: dist-qa

      # ---------- PROMOTE TO STAGING ----------

      - name: Promote QA → Staging (simulated)
        run: |
          mkdir -p dist-staging
          cp -r dist-qa/* dist-staging/ || true

      # ---------- CANARY + ROLLBACK / PROMOTION ----------

      - name: Run canary health check (simulated)
        id: canary
        run: |
          echo "Simulating canary health check..."
          # Here you would normally hit a real health endpoint.
          echo "status=ok" >> "$GITHUB_OUTPUT"

      - name: Rollback staging if canary fails
        if: steps.canary.outputs.status != 'ok'
        run: |
          echo " Canary failed – rolling back staging to previous artifact..."
          # In a real pipeline you would pull / restore the previous artifact here.

      - name: Promote Staging → Prod (simulated)
        if: steps.canary.outputs.status == 'ok'
        run: |
          mkdir -p dist-prod
          cp -r dist-staging/* dist-prod/ || true
          echo " Canary passed – promoting to simulated Prod."

      - name: Upload Prod artifact
        if: steps.canary.outputs.status == 'ok'
        uses: actions/upload-artifact@v4
        with:
          name: prod-drop
          path: dist-prod
