name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit/UI/security tests with coverage (Vitest)
        run: npm test

      - name: Run BDD tests (Cucumber)
        run: npm run test:bdd

      - name: Run security audit (npm audit)
        run: npm run audit

      # E2E is heavier, so we only run it once (Node 20 only anyway)
      - name: Install Playwright browsers (for E2E)
        run: npx playwright install --with-deps

      - name: Run E2E tests (Category + MAP + Low BP)
        run: |
          npx http-server -p 5500 -c-1 . &
          SERVER_PID=$!
          # Give server a moment to start
          sleep 5
          npm run test:e2e
          # Always try to stop the server, but don't fail if it's already dead
          kill $SERVER_PID || true

      # Optional: k6 performance tests are run locally, not in CI,
      # to avoid binary installation issues on GitHub runners.
      # You still keep perf/bp-baseline.js, bp-stress.js, bp-soak.js, etc.
      # - name: Run k6 performance tests (optional)
      #   run: npm run test:k6

      - name: SonarCloud Scan
        if: github.ref == 'refs/heads/main'
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=AjinkyaSawale_Blood-Pressure-Calculator
            -Dsonar.organization=AjinkyaSawale
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
