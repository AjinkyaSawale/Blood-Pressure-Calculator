name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ADD THIS - full clone for SonarCloud

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit/UI/security tests with coverage (Vitest)
        run: npm test
        env:
          NODE_ENV: test

      # ADD THIS DEBUG STEP
      - name: Debug - Check coverage files
        run: |
          echo "=== Coverage directory contents ==="
          ls -la coverage/
          echo ""
          echo "=== First 20 lines of lcov.info ==="
          head -20 coverage/lcov.info || echo "lcov.info not found!"
          echo ""
          echo "=== Coverage summary ==="
          cat coverage/coverage-final.json | jq -r '.total | "Statements: \(.statements.pct)%, Branches: \(.branches.pct)%, Functions: \(.functions.pct)%, Lines: \(.lines.pct)%"' || echo "coverage-final.json not found!"

      - name: Run BDD tests (Cucumber)
        run: npm run test:bdd

      - name: Run security audit (npm audit)
        run: npm run audit

      - name: Install Playwright browsers (for E2E)
        run: npx playwright install --with-deps

      - name: Run E2E tests (Category + MAP + Low BP)
        run: |
          npx http-server -p 5500 -c-1 . &
          SERVER_PID=$!
          sleep 5
          npm run test:e2e
          kill $SERVER_PID || true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=AjinkyaSawale_Blood-Pressure-Calculator
            -Dsonar.organization=ajinkyasawale
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.branch.name=${{ github.ref_name }}
