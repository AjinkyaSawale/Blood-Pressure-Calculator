name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit/UI/security tests with coverage (Vitest)
        run: npm test

      - name: Run BDD tests (Cucumber)
        run: npm run test:bdd

      - name: Run security audit (npm audit)
        run: npm run audit

      - name: Install Playwright browsers (for E2E)
        run: npx playwright install --with-deps

      - name: Run E2E tests (Category + MAP + Low BP)
        run: |
          npx http-server -p 5500 -c-1 . &
          SERVER_PID=$!
          # Give server a moment to start
          sleep 5
          npm run test:e2e
          # Always try to stop the server, but don't fail if it's already dead
          kill $SERVER_PID || true

      - name: SonarCloud Scan
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=AjinkyaSawale_Blood-Pressure-Calculator
            -Dsonar.organization=ajinkyasawale
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      # NEW: Upload JUnit + HTML coverage as artifacts
      - name: Upload test reports and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-and-coverage
          path: |
            test-results/
            coverage/lcov-report/
          retention-days: 7

  deploy-staging:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Azure Container Instance (staging)
        uses: azure/aci-deploy@v1
        with:
          resource-group: rg-bp-calculator
          name: bp-calculator-staging
          image: mcr.microsoft.com/azuredocs/aci-helloworld
          dns-name-label: bp-calculator-staging-25126
          location: eastus
          ports: 80

  smoke-staging:
    name: Smoke test staging (live)
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check staging home page returns 200
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          echo "Original STAGING_URL: '$STAGING_URL'"
          CLEAN_URL=$(echo "$STAGING_URL" | tr -d '[:space:]')
          echo "Cleaned URL: '$CLEAN_URL'"

          # Request the page and capture status code
          HTTP_STATUS=$(curl -s -o smoke.html -w "%{http_code}" "$CLEAN_URL")

          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Expected HTTP 200 from staging, got $HTTP_STATUS"
            exit 1
          fi

      - name: Verify page contains BP title text
        run: |
          # Re-use the previously downloaded smoke.html
          if ! grep -qi "Blood Pressure Category Calculator" smoke.html; then
            echo "❌ Staging page does not contain expected title text"
            exit 1
          fi

          echo "✅ Staging smoke test passed"

  deploy-prod:
    needs: [ci, smoke-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://bp-calculator-prod-14992.eastus.azurecontainer.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Azure Container Instance (prod)
        uses: azure/aci-deploy@v1
        with:
          resource-group: rg-bp-calculator
          name: bp-calculator-prod
          image: mcr.microsoft.com/azuredocs/aci-helloworld
          dns-name-label: bp-calculator-prod-14992
          location: eastus
          ports: 80
