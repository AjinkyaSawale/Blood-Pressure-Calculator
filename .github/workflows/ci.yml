name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit/UI/security tests with coverage (Vitest)
        run: npm test

      - name: Run BDD tests (Cucumber)
        run: npm run test:bdd

      - name: Run security audit (npm audit)
        run: npm run audit

      - name: Install Playwright browsers (for E2E)
        run: npx playwright install --with-deps

      - name: Run E2E tests (Category + MAP + Low BP)
        run: |
          npx http-server -p 5500 -c-1 . &
          SERVER_PID=$!
          sleep 5
          npm run test:e2e
          kill $SERVER_PID || true

      - name: SonarCloud Scan
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=AjinkyaSawale_Blood-Pressure-Calculator
            -Dsonar.organization=ajinkyasawale
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      - name: Upload test reports and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-and-coverage
          path: |
            test-results/
            coverage/lcov-report/
          retention-days: 7

  deploy-staging:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Azure Container Instance (staging)
        uses: azure/aci-deploy@v1
        with:
          resource-group: rg-bp-calculator
          name: bp-calculator-staging
          image: mcr.microsoft.com/azuredocs/aci-helloworld
          dns-name-label: bp-calculator-staging-25126
          location: eastus
          ports: 80
        continue-on-error: true

  smoke-staging:
    name: Smoke test staging (live)
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check staging home page returns 200
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          echo "Original STAGING_URL: '$STAGING_URL'"
          CLEAN_URL=$(echo "$STAGING_URL" | tr -d '[:space:]')
          echo "Cleaned URL: '$CLEAN_URL'"

          HTTP_STATUS=$(curl -s -o smoke.html -w "%{http_code}" "$CLEAN_URL")

          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Expected HTTP 200 from staging, got $HTTP_STATUS"
            exit 1
          fi

      - name: Verify page contains expected staging text
        run: |
          if ! grep -qi "Welcome to Azure Container Instances!" smoke.html; then
            echo "❌ Staging page does not contain expected Azure sample text"
            exit 1
          fi

          echo "✅ Staging smoke test passed"

  deploy-prod:
    needs: [ci, smoke-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://bp-calculator-prod-14992.eastus.azurecontainer.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Azure Container Instance (prod)
        uses: azure/aci-deploy@v1
        with:
          resource-group: rg-bp-calculator
          name: bp-calculator-prod
          image: mcr.microsoft.com/azuredocs/aci-helloworld
          dns-name-label: bp-calculator-prod-14992
          location: eastus
          ports: 80

  build-and-push-image:
    name: Build & push image to ACR (Container Apps)
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    outputs:
      image: ${{ steps.meta.outputs.image }}

    env:
      ACR_SERVER: ${{ secrets.ACR_SERVER }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        run: echo "$ACR_PASSWORD" | docker login "$ACR_SERVER" -u "$ACR_USERNAME" --password-stdin

      - name: Build & push linux/amd64 image to ACR
        id: build
        run: |
          IMAGE_SHA="$ACR_SERVER/bp-calculator:${GITHUB_SHA}"
          IMAGE_LATEST="$ACR_SERVER/bp-calculator:latest"

          echo "Building and pushing $IMAGE_SHA and $IMAGE_LATEST"

          docker buildx build \
            --platform linux/amd64 \
            -t "$IMAGE_SHA" \
            -t "$IMAGE_LATEST" \
            --push \
            .

          echo "IMAGE_SHA=$IMAGE_SHA" >> "$GITHUB_ENV"

      - name: Export image name for downstream jobs
        id: meta
        run: echo "image=$IMAGE_SHA" >> "$GITHUB_OUTPUT"

  deploy-infra:
    name: Deploy Container App infra (blue–green via Bicep)
    needs: [ci, build-and-push-image]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure containerapp extension is installed
        run: |
          az extension add --name containerapp --yes || az extension update --name containerapp

      - name: Deploy Bicep (Container App blue–green)
        env:
          IMAGE: ${{ needs.build-and-push-image.outputs.image }}
        run: |
          echo "Deploying infra with image: $IMAGE"

          az deployment group create \
            -g "${{ secrets.AZURE_RESOURCE_GROUP_IAC }}" \
            --template-file infra/bluegreen-containerapp.bicep \
            --parameters \
              location=${{ secrets.AZURE_LOCATION }} \
              containerImage=$IMAGE \
              acrServer=${{ secrets.ACR_SERVER }} \
              acrUsername=${{ secrets.ACR_USERNAME }} \
              acrPassword=${{ secrets.ACR_PASSWORD }}
        continue-on-error: true

  zap-pentest:
    name: OWASP ZAP Baseline Pentest (Staging)
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: OWASP ZAP Baseline Scan (Staging Pentest)
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: ${{ vars.STAGING_URL }}
          cmd_options: "-a"
        continue-on-error: true

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v6
        with:
          name: zap-pentest-report
          path: report_html.html
          retention-days: 7
