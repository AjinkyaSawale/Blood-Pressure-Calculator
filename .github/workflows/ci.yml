name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit/UI/security tests with coverage (Vitest)
        run: npm test

      - name: Run BDD tests (Cucumber)
        run: npm run test:bdd

      - name: Run security audit (npm audit)
        run: npm run audit

      - name: Install Playwright browsers (for E2E)
        run: npx playwright install --with-deps

      - name: Run E2E tests (Category + MAP + Low BP)
        run: |
          npx http-server -p 5500 -c-1 . &
          SERVER_PID=$!
          # Give server a moment to start
          sleep 5
          npm run test:e2e
          # Always try to stop the server, but don't fail if it's already dead
          kill $SERVER_PID || true

      - name: SonarCloud Scan
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=AjinkyaSawale_Blood-Pressure-Calculator
            -Dsonar.organization=ajinkyasawale
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      # NEW: Upload JUnit + HTML coverage as artifacts
      - name: Upload test reports and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-and-coverage
          path: |
            test-results/
            coverage/lcov-report/
          retention-days: 7
