name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---- Code quality + tests ----
      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit + UI + telemetry tests (Vitest)
        run: npm test

      - name: BDD tests (Cucumber)
        run: npm run test:bdd

      - name: Security tests (package checks / npm audit wrapper)
        run: npm run test:security

      # ---- Playwright browsers for E2E ----
      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright + http-server)
        run: |
          npx http-server -p 5500 -c-1 . &
          SERVER_PID=$!
          npm run test:e2e
          kill $SERVER_PID

      # ---- Performance tests (k6) ----
      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Performance tests (k6)
        run: |
          npx http-server -p 5500 -c-1 . &
          SERVER_PID=$!
          npm run test:k6
          kill $SERVER_PID

      # ---- SonarCloud analysis ----
      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=AjinkyaSawale_Blood-Pressure-Calculator
            -Dsonar.organization=ajinkyasawale
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  # ---------- CD: QA → Staging → Canary → Rollback/Prod (simulated) ----------

  deploy_qa:
    needs: ci
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: https://example.com/qa
    steps:
      - name: Deploy to QA (simulated)
        run: echo "Deploying static build to QA…"

  deploy_staging:
    needs: deploy_qa
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://example.com/staging
    steps:
      - name: Deploy to Staging (simulated)
        run: echo "Deploying to Staging…"

  canary_release:
    needs: deploy_staging
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: production-canary
      url: https://example.com/canary
    steps:
      - name: Canary release (simulated 10% traffic)
        run: |
          echo "Routing 10% traffic to new version…"
          echo "Canary health checks passed ✅"

  rollback_production:
    needs: canary_release
    if: failure()
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://example.com/prod
    steps:
      - name: Rollback production (simulated)
        run: echo "Rolling back to previous stable version…"

  deploy_production:
    needs: canary_release
    if: needs.canary_release.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://example.com/prod
    steps:
      - name: Deploy to Production (simulated)
        run: echo "Promoting canary to 100% traffic…"
