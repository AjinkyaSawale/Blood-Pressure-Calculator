name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      # 1) Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Setup Node
      - name: Setup Node.js ${{ matrix.node-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # 3) Install dependencies (NOT npm ci because lockfile may lag dependencies)
      - name: Install dependencies
        run: npm install

      # 4) Install Playwright browsers (for E2E)
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 5) Install k6 (for performance tests)
      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y k6

      # 6) Lint
      - name: Run ESLint
        run: npm run lint

      # 7) Unit + UI + telemetry tests with coverage
      - name: Run unit tests (Vitest)
        run: npm test

      # 8) BDD tests
      - name: Run BDD tests (Cucumber)
        run: npm run test:bdd

      # 9) Security tests (npm audit / custom checks)
      - name: Run security tests
        run: npm run test:security

      # 10) Start HTTP server for E2E + k6 (single server, reused)
      - name: Start HTTP server
        run: |
          npx http-server -p 5500 -c-1 . &
          echo $! > http-server.pid
          sleep 5

      # 11) E2E tests (Playwright)
      - name: Run E2E tests
        run: npm run test:e2e

      # 12) k6 baseline perf test
      - name: Run k6 baseline performance test
        run: npm run test:k6

      # 13) Stop HTTP server (avoid EADDRINUSE)
      - name: Stop HTTP server
        if: always()
        run: |
          if [ -f http-server.pid ]; then
            kill "$(cat http-server.pid)" || true
            rm http-server.pid
          fi

      # 14) SonarCloud (static code analysis)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=AjinkyaSawale_Blood-Pressure-Calculator
            -Dsonar.organization=ajinkyasawale
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
