name: ci

on:
  push:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node (match local)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

      - name: Run unit + UI + security tests
        run: npm test

      - name: Run npm audit (security scan)
        run: npm audit --audit-level=high

    outputs:
      ci_status: ${{ job.status }}

  deploy_qa:
    needs: ci
    runs-on: ubuntu-latest
    if: needs.ci.result == 'success'
    steps:
      - name: Deploy to QA (simulated)
        run: echo "Deploying to QA environment..."
    environment:
      name: qa
      url: https://example.com/qa

  deploy_staging:
    needs: deploy_qa
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging (simulated)
        run: echo "Deploying to Staging environment..."
    environment:
      name: staging
      url: https://example.com/staging

  canary_release:
    needs: deploy_staging
    runs-on: ubuntu-latest
    steps:
      - name: Canary release (10% rollout simulation)
        run: |
          echo "Starting 10% canary rollout..."
          sleep 2
          echo "Monitoring telemetry + logs..."
          sleep 2
          echo "Canary passed ✔"

    environment:
      name: canary
      url: https://example.com/canary

  deploy_production:
    needs: canary_release
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production (simulated)
        run: echo "Deploying to full production..."
    environment:
      name: production
      url: https://example.com
