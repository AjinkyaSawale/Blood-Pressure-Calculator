name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Run BDD tests (Cucumber)
        run: npm run test:bdd

      # Install Playwright browsers (needed for Chromium in CI)
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Start a simple HTTP server and run E2E tests against it
      - name: Run E2E tests
        run: |
          npx http-server . -p 5500 &
          sleep 5
          npm run test:e2e

      - name: Security Audit
        run: npm run audit

