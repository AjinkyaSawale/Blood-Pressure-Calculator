name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  ci:
    name: CI checks (lint + tests + sonar)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.19.6]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --- Code quality / security ---

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests + coverage (Vitest)
        run: npm test

      - name: Run BDD tests (Cucumber)
        run: npm run test:bdd

      - name: Run security tests (npm audit / package checks)
        run: npm run test:security

      # --- UI + E2E (Playwright) ---

      - name: Run E2E tests (with local http-server)
        run: |
          npx http-server -p 5500 -c-1 . &
          SERVER_PID=$!
          sleep 3
          npm run test:e2e || (kill $SERVER_PID && exit 1)
          kill $SERVER_PID

      # --- SonarCloud analysis ---

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=AjinkyaSawale_Blood-Pressure-Calculator
            -Dsonar.organization=ajinkyasawale
            -Dsonar.sources=.
            -Dsonar.tests=tests
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.exclusions=coverage/**,perf/**,bdd/**,e2e/**,tests/lint/**,tests/security/**
            -Dsonar.test.inclusions=tests/**/*.test.js

  deploy_qa:
    name: Deploy to QA (simulated)
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: QA deploy
        run: echo "Deploying to QA environment (simulated)…"

  deploy_staging:
    name: Deploy to Staging (simulated)
    needs: deploy_qa
    runs-on: ubuntu-latest
    steps:
      - name: Staging deploy
        run: echo "Deploying to Staging environment (simulated)…"

  canary_release:
    name: Canary release (simulated)
    needs: deploy_staging
    runs-on: ubuntu-latest
    steps:
      - name: Run canary release
        run: echo "Running canary release with 10% traffic (simulated)…"

  rollback_production:
    name: Rollback production (simulated)
    needs: canary_release
    if: failure() && always()
    runs-on: ubuntu-latest
    steps:
      - name: Rollback
        run: echo "Canary failed – rolling back production (simulated)…"

  deploy_production:
    name: Deploy to Production (simulated)
    needs: canary_release
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Production deploy
        run: echo "Canary healthy – deploying to Production (simulated)…"
