name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    env:
      # Used by our k6 test script to skip k6 when not installed
      SKIP_K6: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Run BDD tests (Cucumber)
        run: npm run test:bdd

      - name: Run security audit (npm audit)
        run: npm run audit

      # E2E is heavier, so only run it once on Node 20
      - name: Install Playwright browsers (for E2E)
        if: matrix.node-version == '20'
        run: npx playwright install --with-deps

      - name: Run E2E tests (Category + MAP + Low BP)
        if: matrix.node-version == '20'
        run: |
          npx http-server -p 5500 -c-1 . &
          SERVER_PID=$!
          sleep 5
          npm run test:e2e || (kill $SERVER_PID && exit 1)
          kill $SERVER_PID

      # -------------------------------
      # Performance tests with k6 (soft-skipped in CI)
      # -------------------------------
      - name: Run k6 baseline performance test (locally only)
        if: matrix.node-version == '20'
        run: |
          if [ "$SKIP_K6" = "1" ]; then
            echo "SKIP_K6=1 → skipping k6 baseline test in CI."
            exit 0
          fi
          npm run test:k6

      # -------------------------------
      # Simple "canary" deployment simulation
      # -------------------------------
      - name: Build QA, Staging and Prod artifacts
        if: matrix.node-version == '20'
        run: |
          mkdir -p dist/qa dist/staging dist/prod

          # QA = current develop
          cp index.html styles.css app.js ui.js telemetry.js dist/qa/ 2>/dev/null || true

          # Staging = same as QA for now
          cp -r dist/qa/* dist/staging/ 2>/dev/null || true

          # Prod = same as Staging (pretend it's live)
          cp -r dist/staging/* dist/prod/ 2>/dev/null || true

      - name: Canary check against QA artifact
        if: matrix.node-version == '20'
        run: |
          if [ ! -f dist/qa/index.html ]; then
            echo "No QA artifact found, failing canary."
            exit 1
          fi
          echo "Canary check passed for QA artifact."

      # In a more advanced version, if canary failed we would restore previous prod from an artifact.
      # For now, we just simulate the flow and keep the pipeline green if all previous steps pass.
