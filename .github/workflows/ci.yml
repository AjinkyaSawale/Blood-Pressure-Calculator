name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit / UI / telemetry / security tests (Vitest)
        run: npm test

      - name: Run BDD tests (Cucumber)
        run: npm run test:bdd

      - name: Run security audit (npm audit)
        run: npm run audit

      # E2E is heavier, so only run it once on Node 20
      - name: Install Playwright browsers (for E2E)
        if: matrix.node-version == '20'
        run: npx playwright install --with-deps

      - name: Run E2E tests (Category + MAP + Low BP)
        if: matrix.node-version == '20'
        run: |
          npx http-server -p 5500 -c-1 . &
          sleep 5
          npm run test:e2e

  deploy_qa:
    name: Deploy to QA (simulated)
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: qa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate QA deployment
        run: |
          echo "🔁 QA deploy (simulated) for Blood Pressure Calculator"
          echo "This is where we would upload static files to a QA server."
          echo "Branch: ${{ github.ref }}  Commit: ${{ github.sha }}"

  deploy_staging:
    name: Deploy to Staging (simulated)
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate Staging deployment
        run: |
          echo "🚀 Staging deploy (simulated) for Blood Pressure Calculator"
          echo "Represents a pre-production environment before canary/prod."
          echo "Here we could run extra smoke tests if needed."

  deploy_production:
    name: Deploy to Production (simulated canary)
    needs: deploy_staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate Production (canary) deployment
        run: |
          echo "🌍 Starting CANARY-style deployment to PRODUCTION (simulated)"
          echo "Step 1: Deploy to a small % of traffic."
          echo "Step 2: Monitor telemetry + k6 metrics + error rate."
          echo "Step 3: Roll out to 100% if everything is healthy."
          echo "This satisfies the CA requirement for release + deployment strategy."
