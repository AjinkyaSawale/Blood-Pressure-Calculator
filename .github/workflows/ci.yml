name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20.19.6
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ----- CODE QUALITY / TESTS -----

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit tests + coverage (Vitest)
        run: npm test

      - name: BDD tests (Cucumber)
        run: npm run test:bdd

      - name: Security tests (custom)
        run: npm run test:security

      # ----- E2E (Playwright + http-server) -----

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright against http-server)
        run: |
          npx http-server -p 5500 -c-1 . &
          SERVER_PID=$!

          npx wait-on http://127.0.0.1:5500/index.html
          npm run test:e2e

          kill $SERVER_PID

      # ----- PERFORMANCE (k6) -----

      - name: Install k6 from official repo
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg curl
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/k6.gpg
          echo "deb [signed-by=/etc/apt/keyrings/k6.gpg] https://dl.k6.io/deb stable main" | \
            sudo tee /etc/apt/sources.list.d/k6.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 performance tests
        run: |
          npx http-server -p 5500 -c-1 . &
          SERVER_PID=$!

          npx wait-on http://127.0.0.1:5500/index.html
          npm run test:k6

          kill $SERVER_PID

      # ----- SONARCLOUD -----

      - name: SonarCloud analysis
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=AjinkyaSawale_Blood-Pressure-Calculator
            -Dsonar.organization=ajinkyasawale
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  # ---------- SIMULATED CD FLOW ----------

  deploy_qa:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to QA (simulated)
        run: echo "Deploying to QA environment at https://example.com/qa"

  deploy_staging:
    needs: deploy_qa
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging (simulated)
        run: echo "Deploying to Staging environment at https://example.com/staging"

  canary_release:
    needs: deploy_staging
    runs-on: ubuntu-latest
    steps:
      - name: Canary release (10% traffic, simulated)
        run: echo "Running canary release with 10% traffic"

  rollback_production:
    needs: canary_release
    if: needs.canary_release.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Rollback production (simulated)
        run: echo "Canary failed – rolling back to previous production version"

  deploy_production:
    needs: canary_release
    if: needs.canary_release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production (simulated)
        run: echo "Canary OK – promoting to full production at https://example.com"
